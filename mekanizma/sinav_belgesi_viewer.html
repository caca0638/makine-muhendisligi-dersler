  <script>
    const titles = ['Sinav Kagidi (30/12/2025)', 'Soru 1 Cozum: Devre & Kisitlar', 'Soru 1 Cozum: Hiz & Ivme', 'Soru 2 Cozum: Planet Disli'];
    const descs = ['M.C.B.U. Mekanizma Teknigi Final Sinavi - Soru 1 ve Soru 2', 'Serbestlik Derecesi, Vektor Kapali Devre ve Skaler Kisit Denklemleri', 'Acisal Hiz (w3) ve Acisal Ivme (alpha3) Analitik Turevleri', 'Planet Disli Mekanizmasi N25 Hiz Orani Cozumu'];
    let currentTab = 0;
    let currentZoom = 1.0;

    function switchTab(index) {
      for (let i = 0; i < 4; i++) {
        const pane = document.getElementById('pane-' + i);
        const btn = document.getElementById('tab-' + i);
        if (i === index) {
          pane.style.display = 'flex';
          btn.className = 'tab-btn px-4 py-2.5 rounded-t-lg transition border-b-2 border-blue-500 text-blue-400 font-bold bg-zinc-800';
        } else {
          pane.style.display = 'none';
          btn.className = 'tab-btn px-4 py-2.5 rounded-t-lg transition border-b-2 border-transparent text-zinc-400 hover:text-zinc-200';
        }
      }
      currentTab = index;
      document.getElementById('doc-title').innerText = titles[index];
      document.getElementById('doc-desc').innerText = descs[index];
      resetZoom();
    }

    function updateZoom() {
      const img = document.getElementById('img-' + currentTab);
      if (img) {
        img.style.transform = `scale(${currentZoom})`;
      }
      document.getElementById('zoom-level').innerText = Math.round(currentZoom * 100) + '%';
    }

    function zoomIn() {
      if (currentZoom < 3.0) {
        currentZoom += 0.25;
        updateZoom();
      }
    }

    function zoomOut() {
      if (currentZoom > 0.5) {
        currentZoom -= 0.25;
        updateZoom();
      }
    }

    function resetZoom() {
      currentZoom = 1.0;
      updateZoom();
    }
  </script>
